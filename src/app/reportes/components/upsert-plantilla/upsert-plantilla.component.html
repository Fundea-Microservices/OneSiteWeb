<div class="modal-body">
  <form [formGroup]="form">    

    <div class="mb-3">
      <label class="form-label">Archivo Excel</label>
      <input  #fileInput type="file" class="form-control" (change)="onFileSelected($event)" />
    </div>

    <div class="mb-3">
      <!-- <label class="form-label">Nombre de la plantilla</label> -->
      <input type="hidden" class="form-control" formControlName="nombre" placeholder="Ej: plantilla_creditos" />
    </div>

    @if (mensaje()) {
      <div class="alert alert-info mt-3">{{ mensaje() }}</div>
    }
  </form>
</div>

<div class="modal-footer">
  <button class="btn btn-secondary" (click)="cerrar()">Cerrar</button>
  <button class="btn btn-primary" (click)="guardar()" [disabled]="form.invalid || cargando()">
    {{ cargando() ? 'Guardando...' : 'Guardar' }}
  </button>
</div>
