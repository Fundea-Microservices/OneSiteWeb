<form [formGroup]="form()" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label class="form-label">Rol</label>
    <select class="form-select form-select-sm" formControlName="rolId">
      <option value="" disabled>Seleccione un rol</option>
      <option *ngFor="let rol of rolesList()" [value]="rol.rolId">
        {{ rol.name }}
      </option>
    </select>
  </div>

  <div class="form-check form-switch mb-3">
    <input class="form-check-input" type="checkbox" formControlName="active" />
    <label class="form-check-label">Activo</label>
  </div>

  <div class="mb-3">
    <label class="form-label">Hora inicio</label>
    <input type="time" class="form-control form-control-sm" formControlName="horaInicio" />
  </div>

  <div class="mb-3">
    <label class="form-label">Hora fin</label>
    <input type="time" class="form-control form-control-sm" formControlName="horaFin" />
  </div>

  <div class="mb-3">
    <label class="form-label">Días de la semana</label>
    <input type="text" class="form-control form-control-sm" placeholder="Ej: LUN,MAR,MIÉ" formControlName="diaSemana" />
  </div>

  <div class="mb-3">
    <label class="form-label">Días del mes</label>
    <input type="text" class="form-control form-control-sm" placeholder="Ej: 1,15,30" formControlName="diaMes" />
  </div>

  <div class="row justify-content-end">
    <div class="col-auto">
      <button type="button" class="btn btn-secondary m-2" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn btn-primary m-2" [disabled]="form().invalid">
        {{ btnText }}
      </button>
    </div>
  </div>
</form>
