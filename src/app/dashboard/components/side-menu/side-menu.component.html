<!-- Overlay para cerrar el menú en móvil -->
@if (isMenuOpen()) {
    <div 
        class="fixed inset-0 bg-black bg-opacity-50 z-20 lg:hidden"
        (click)="closeMenu()">
    </div>
}

<!-- Side Menu -->
<div id="menu" 
    [class]="'bg-custom-sidebar min-h-screen z-30 text-slate-900 fixed left-0 h-screen overflow-y-scroll w-[250px] transition-transform duration-300 ease-in-out ' + 
    (isMenuOpen() ? 'translate-x-0' : '-translate-x-full lg:translate-x-0')">
    <app-side-menu-header />
    <app-side-menu-list (submenuSelected)="closeMenu()" />
</div>

<!-- Modal de carga de catálogos (renderizado a nivel raíz) -->
<app-loading-catalogs />
