<div id="logo" class=" px-8 align-middle justify-center">
  <!-- <h1 class="text-lg md:text-2xl font-bold text-slate-900">Dash<span class="text-blue-500">8</span>.</h1> -->

  <img src="logos/OneSite_HF_fondo_blanco.svg" alt="Logo" width="160" />
</div>
<div class="flex flex-col items-center justify-center text-center">
  <div id="profile" class="mb-2">
    <a routerLink="/config/user">
      <img
        class="rounded-full w-14 h-14 max-w-14 object-cover"
        [src]="conFoto() ? user().photoUrl || 'images/default-user.png' : 'images/default-user.png'"
        alt="Usuario"
      />
    </a>
  </div>

  <a
    routerLink="/config/user"
    class="font-bold text-sm truncate sm:whitespace-normal sm:break-words"
    [style]="{ 'font-size': user().name1.length > 20 ? '0.75rem' : '' }"
  >
    {{ user().name1 || 'Usuario' }} {{ user().lastName1 || '' }}
  </a>

  <p class="text-slate-700 truncate text-xs">
    {{ user().rol.name || 'Rol desconocido' }}
  </p>
</div>
