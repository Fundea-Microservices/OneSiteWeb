<div id="logo" class=" px-8 align-middle justify-center bg-custom-sidebar-header">
  <!-- <h1 class="text-lg md:text-2xl font-bold text-slate-900">Dash<span class="text-blue-500">8</span>.</h1> -->

  <img src="logos/OneSite_HF_fondo_blanco.svg" alt="Logo" width="160" />
</div>
<div class="flex items-center gap-2 px-3 pb-2 border-b-1 mb-2 bg-custom-sidebar-header">
  <div id="profile" class="shrink-0">
    <a routerLink="/config/user">
      <img
        class="rounded-full w-10 h-10 max-w-10 object-cover"
        [src]="conFoto() ? user().photoUrl || 'images/default-user.png' : 'images/default-user.png'"
        alt="Usuario"
      />
    </a>
  </div>

  <div class="min-w-0">
    <span class="block font-bold text-sm truncate" [title]="(user().name1 || 'Usuario') + ' ' + (user().lastName1 || '')">
      {{ user().name1 || 'Usuario' }} {{ user().lastName1 || '' }}
    </span>

    <p class="txt-secundario truncate mb-0">
      {{ user().rol.name || 'Rol desconocido' }}
    </p>
  </div>
</div>
