<div id="nav" class="w-full">



  <section class="app">
    <div class="sidebar">
      <nav class="sidebar-nav">

        <ul>

          @for (acceso of accesos; track acceso.accesoId) {

            <li>
            <a [routerLink]="[acceso.menu.pathWeb]"><ion-icon [name]="acceso.menu.icon"></ion-icon> <span>{{acceso.menu.label}}</span></a>

            @if (acceso.subMenus.length > 0) {
              <ul class="nav-flyout">
                @for (submenu of acceso.subMenus; track submenu.accesoId) {
                  <li>
                    <a [routerLink]="[submenu.menu.pathWeb]"><ion-icon [name]="submenu.menu.icon"></ion-icon> {{submenu.menu.label}}</a>
                  </li>

                }
              </ul>              
            }
            
          </li>

          }

          <li>
            <a (click)="logout()"><ion-icon name="log-out-outline"></ion-icon> <span class="">Cerrar Sesión</span></a>
          </li>

        </ul>
        
      </nav>
    </div>
  </section>
</div>
