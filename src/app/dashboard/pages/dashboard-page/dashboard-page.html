<div class="bg-slate-100 overflow-y-scroll w-screen h-screen antialiased text-slate-900 selection:bg-blue-600 selection:text-white">
    <div class="flex flex-col relative w-screen">
        
        <!-- Barra superior para móvil -->
        <div class="lg:hidden fixed top-0 left-0 right-0 bg-white shadow-md z-10 h-16 flex items-center px-4">
            <button 
                (click)="toggleMenu()"
                class="text-gray-700 hover:text-gray-900 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <span class="ml-4 font-semibold text-lg">Menú</span>
        </div>

        <app-side-menu/>
        
        <div class="ml-0 lg:ml-[250px] px-2 flex-1 h-full mr-3 pt-16 lg:pt-0">
			<router-outlet></router-outlet>
		</div>
    </div>
</div>
