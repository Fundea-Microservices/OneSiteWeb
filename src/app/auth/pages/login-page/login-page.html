<div class="min-h-screen flex items-center justify-center bg-[#b4b7bf] px-4 py-8">
  <div class="w-full max-w-md">

    <!-- Header con imágenes -->
    <div class="flex flex-col items-center">
      <img src="images/ImageLogin.png" alt="Login Image" class="w-full h-[300px] object-contain mb-4" />
      <img src="images/OneSite-logo.png" alt="Logo" class="w-full h-[100px] object-contain mt-[-20px] mb-[-10px]" />
    </div>

    <!-- Título -->
    <h1 class="text-2xl text-center font-semibold text-black mb-4">Ingreso</h1>

    <!-- Alerta de entorno -->
    <p class="text-red-600 text-xl text-center mb-4" id="env-warning">
      AMBIENTE PREPRODUCCIÓN
    </p>

    <!-- Input Usuario -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
      <div class="flex items-center border border-gray-300 rounded-lg bg-white px-3 py-2">
        <i class="text-xl text-gray-400 mr-2" name="person-circle-outline"></i>
        <input type="text" placeholder="Usuario" class="w-full outline-none text-sm text-black" [value]="userName()"
          (change)="userName.set(txtUserName.value)" (input)="userName.set(txtUserName.value)" #txtUserName />
      </div>
    </div>

    <!-- Input Contraseña -->
    <div class="mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
      <div class="flex items-center border border-gray-300 rounded-lg bg-white px-3 py-2">
        <i class="text-xl text-gray-400 mr-2" name="lock-closed-outline"></i>
        <input type="password" placeholder="Contraseña" class="w-full outline-none text-sm text-black"
          [value]="password()" (input)="password.set(txtPassword.value)" #txtPassword />

      </div>
      <!-- Div para manejar errores de validación -->
      @if (errorObj().isError) {
      <div class="mb-4">
        <p class="text-red-600 text-sm">{{ errorObj().message }}</p>
      </div>
      }
    </div>


    <!-- Botón Ingresar -->
    <button
      class="w-full bg-[#006aad] text-white font-semibold py-3 rounded-lg hover:bg-[#055c94] transition-all flex items-center justify-center gap-2"
      (click)="login()">
      <i class="text-xl" name="arrow-forward-outline"></i>
      Ingresar
    </button>
    
  </div>
</div>
