<div class="">
  <!-- Pantalla de carga -->
  @if (loading()) {
    <app-loading-screen 
      [message]="loadingMessage()" 
      [subtitle]="loadingSubtitle()">
    </app-loading-screen>
  }

  <section class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div class="bg-white p-5 flex rounded-2xl shadow-lg max-w-3xl">
      <div class="md:w-1/2 pl-1 pr-8">
        <!-- <p class="text-3xl font-bold text-[#002D74]">Login OneSite</p> -->
        <div class="flex flex-col items-center">
          <img src="images/OneSite-logo-blanco.png" alt="Logo" class="w-full h-[100px] object-contain mt-[-16px] mb-[-2px]" />
          <div class="flex items-center justify-center gap-1">
            <p class="text-md font-bold" [style.color]="entorno().textColor">AMBIENTE {{entorno().ambiente | uppercase}}</p>
            <button
              (click)="refreshEntorno()"
              [disabled]="refreshingEntorno()"
              [style.color]="entorno().textColor"
              class="text-xs opacity-40 hover:opacity-100 transition-opacity p-1 rounded"
              title="Actualizar configuración de entorno">
              @if (refreshingEntorno()) {
                <span class="spinner-border spinner-border-sm" style="width:.7rem;height:.7rem"></span>
              } @else {
                &#x21BA;
              }
            </button>
          </div>
        </div>
        <div class="mt-2">
          <div>
            <label class="block" [style.color]="entorno().textColor">Usuario</label>
            <input type="text" name="userName" id="" placeholder="Ingrese su usuario"
              class="w-full px-4 py-3 rounded-lg mt-2 border focus:border-blue-500 focus:bg-white focus:outline-none" [style.backgroundColor]="entorno().bgColor"
              autofocus autocomplete required [value]="userName()" (change)="userName.set(txtUserName.value)"
              (input)="userName.set(txtUserName.value)" #txtUserName>
          </div>

          <div class="my-4">
            <label class="block" [style.color]="entorno().textColor">Password</label>
            <div class="relative mt-2">
              <input [type]="verPassword() ? 'text' : 'password'" name="password" id="" placeholder="Ingrese su contraseña" minlength="6" class="w-full pl-4 pr-12 py-3 rounded-lg border focus:border-blue-500
                    focus:bg-white focus:outline-none" [style.backgroundColor]="entorno().bgColor" required [value]="password()"
                (input)="onPasswordInput(txtPassword.value)" #txtPassword (keyup.enter)="login()">
              <button type="button" (click)="toggleVerPassword()" [title]="verPassword() ? 'Ocultar' : 'Mostrar'"
                class="absolute inset-y-0 right-0 flex items-center px-4 text-gray-500 hover:text-gray-700 text-xl">
                <ion-icon [name]="verPassword() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
              </button>
            </div>
          </div>

          <!-- Switch de usuario externo (OneSiteEx) -->
          <div class="flex items-center justify-between my-4">
            <div class="flex flex-col">
              <span class="text-sm font-semibold" [style.color]="entorno().textColor">Externo</span>
              <span class="text-xs text-gray-500">Usuarios de OneSiteEx</span>
            </div>
            <button
              type="button"
              role="switch"
              [attr.aria-checked]="esExterno()"
              aria-label="Ingresar como usuario externo de OneSiteEx"
              (click)="toggleExterno()"
              class="relative inline-flex h-6 w-11 shrink-0 items-center rounded-full transition-colors focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
              [class.bg-blue-600]="esExterno()"
              [class.bg-gray-300]="!esExterno()">
              <span
                class="inline-block h-4 w-4 transform rounded-full bg-white shadow transition-transform"
                [class.translate-x-6]="esExterno()"
                [class.translate-x-1]="!esExterno()"></span>
            </button>
          </div>

          <!-- <div class="text-right mt-2">
            <a href="#" class="text-sm font-semibold text-gray-700 hover:text-blue-700 focus:text-blue-700">Forgot
              Password?</a>
          </div> -->

          @if (errorObj().isError) {
          <div class="mb-4">
            <p class="text-red-600 text-sm">{{ errorObj().message }}</p>
          </div>
          }


          <button type="submit" class="w-full block bg-blue-600 hover:bg-blue-700 focus:bg-blue-700 text-white font-bold rounded-lg
                px-4 py-3 mt-6" (click)="login()">
            @if(loading()) {
            <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
            Ingresando...
            } @else {
            Ingresar
            }
          </button>
        </div>
