<form [formGroup]="form()">

  <div class="row">
    <div class="mb-3 col-md-8">
      <label class="form-label">Nombre del catálogo</label>
      <input type="text" class="form-control form-control-sm" formControlName="nombre"
        placeholder="Ej. Tipo de Crédito" />
      @if (hasError('nombre', 'required')) {
        <div class="text-danger small">Nombre del catálogo es requerido</div>
      }
      @if (hasError('nombre', 'maxlength')) {
        <div class="text-danger small">Máximo 200 caracteres</div>
      }
    </div>

    <div class="mb-3 col-md-4">
      <label class="form-label">Código</label>
      <input type="text" class="form-control form-control-sm" formControlName="codigo"
        placeholder="Ej. TIPO_CREDITO" />
      @if (hasError('codigo', 'required')) {
        <div class="text-danger small">Código es requerido</div>
      }
      @if (hasError('codigo', 'maxlength')) {
        <div class="text-danger small">Máximo 50 caracteres</div>
      }
    </div>
  </div>

  <div class="mb-3 form-check">
    <input type="checkbox" class="form-check-input" id="catalogoActivo" formControlName="activo" />
    <label class="form-check-label" for="catalogoActivo">Activo</label>
  </div>

  <hr />

  <div class="d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-secondary btn-sm" (click)="onCancel()">Cancelar</button>
    <button type="button" class="btn btn-primary btn-sm" (click)="onSubmit()">{{ btnText }}</button>
  </div>

</form>
