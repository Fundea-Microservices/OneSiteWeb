<input
  [id]="inputId()"
  [value]="texto()"
  (input)="onInput($event)"
  [disabled]="disabled()"
  type="text"
  inputmode="numeric"
  autocomplete="off"
  maxlength="10"
  placeholder="DD/MM/AAAA"
  [class]="claseInput()"
/>
@if (mensajeError(); as mensaje) {
  <p class="text-xs text-red-600 mt-1">{{ mensaje }}</p>
}
