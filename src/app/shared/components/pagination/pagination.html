<nav class="mt-6 flex flex-col items-center gap-2" aria-label="Paginación">

  <!-- Registros por página y rango mostrado -->
  <div class="flex flex-wrap items-center justify-center gap-x-3 gap-y-1">
    <label for="pageSizeSelect" class="sr-only">Registros por página</label>
    <select id="pageSizeSelect" (change)="changePageSize(+txtPageSize.value)" #txtPageSize
      class="block py-0.5 px-2 text-sm text-gray-600 bg-transparent border-gray-300 border rounded-sm appearance-none focus:outline-none focus:border-gray-600">
      <option value="5" [selected]="paginationObj().pageSize === 5">5 registros página</option>
      <option value="10" [selected]="paginationObj().pageSize === 10">10 registros página</option>
      <option value="20" [selected]="paginationObj().pageSize === 20">20 registros página</option>
      <option value="50" [selected]="paginationObj().pageSize === 50">50 registros página</option>
    </select>

    @if (rango(); as r) {
      <span class="txt-ayuda">Mostrando {{ r.desde }} – {{ r.hasta }} de {{ r.total }}</span>
    }
  </div>

  <!-- Páginas: con más de {{ maxPaginasVisibles() }} solo se ven la primera, la
       última y una ventana alrededor de la actual; "…" salta de sección. -->
  <div class="flex flex-wrap items-center justify-center gap-1">

    <button type="button" (click)="goToPage(1)" [disabled]="paginaActual() === 1"
      title="Primera página" aria-label="Primera página"
      class="min-w-9 h-9 px-2 rounded-md text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none">
      «
    </button>

    <button type="button" (click)="previousPage()" [disabled]="paginaActual() === 1"
      title="Página anterior" aria-label="Página anterior"
      class="min-w-9 h-9 px-2 rounded-md text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none">
      ←
    </button>

    @for (item of paginas(); track item) {
      @if (esNumero(item)) {
        <button type="button" (click)="goToPage(+item)"
          [attr.aria-current]="item === paginaActual() ? 'page' : null"
          [attr.aria-label]="'Página ' + item"
          [class]="item === paginaActual()
            ? 'min-w-9 h-9 px-2 rounded-md text-sm font-bold bg-primario-600 text-white hover:bg-primario-700'
            : 'min-w-9 h-9 px-2 rounded-md text-sm text-gray-700 hover:bg-gray-100'">
          {{ item }}
        </button>
      } @else if (item === 'salto-atras') {
        <button type="button" (click)="saltarAtras()"
          [title]="'Retroceder ' + saltoSeccion + ' páginas'"
          [attr.aria-label]="'Retroceder ' + saltoSeccion + ' páginas'"
          class="min-w-9 h-9 px-2 rounded-md text-sm text-gray-500 hover:bg-gray-100 hover:text-primario-600">
          …
        </button>
      } @else {
        <button type="button" (click)="saltarAdelante()"
          [title]="'Avanzar ' + saltoSeccion + ' páginas'"
          [attr.aria-label]="'Avanzar ' + saltoSeccion + ' páginas'"
          class="min-w-9 h-9 px-2 rounded-md text-sm text-gray-500 hover:bg-gray-100 hover:text-primario-600">
          …
        </button>
      }
    }

    <button type="button" (click)="nextPage()" [disabled]="paginaActual() === totalPages"
      title="Página siguiente" aria-label="Página siguiente"
      class="min-w-9 h-9 px-2 rounded-md text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none">
      →
    </button>

    <button type="button" (click)="goToPage(totalPages)" [disabled]="paginaActual() === totalPages"
      title="Última página" aria-label="Última página"
      class="min-w-9 h-9 px-2 rounded-md text-sm text-gray-700 bg-gray-100 hover:bg-gray-200 disabled:opacity-50 disabled:pointer-events-none">
      »
    </button>
  </div>
</nav>
