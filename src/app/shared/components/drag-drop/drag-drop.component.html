<div class="flex gap-8 p-4">
  <div class="w-1/2">
    <h2 class="font-bold text-lg mb-2">Lista A</h2>
    <ul id="listA" class="border p-2 rounded bg-gray-100 min-h-[100px]">
      <li *ngFor="let item of listA()" class="bg-white p-2 mb-1 rounded shadow cursor-move">
        {{ item }}
      </li>
    </ul>
  </div>

  <div class="w-1/2">
    <h2 class="font-bold text-lg mb-2">Lista B</h2>
    <ul id="listB" class="border p-2 rounded bg-gray-100 min-h-[100px]">
      <li *ngFor="let item of listB()" class="bg-white p-2 mb-1 rounded shadow cursor-move">
        {{ item }}
      </li>
    </ul>
  </div>
</div>
