<form (ngSubmit)="onSubmit()" [formGroup]="form" class="p-3">

  @if(!isAdmin()) {
  <div class="mb-3">
    <label for="currentPassword" class="form-label">Contraseña actual</label>
    <div class="input-group has-validation">
      <input [type]="verPassword()['currentPassword'] ? 'text' : 'password'" id="currentPassword"
        formControlName="currentPassword" class="form-control"
        [class.is-invalid]="form.get('currentPassword')?.invalid && form.get('currentPassword')?.touched">
      <button type="button" class="btn btn-outline-secondary" (click)="toggleVerPassword('currentPassword')"
        [title]="verPassword()['currentPassword'] ? 'Ocultar' : 'Mostrar'">
        <ion-icon [name]="verPassword()['currentPassword'] ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </button>
      <div class="invalid-feedback">Este campo es requerido.</div>
    </div>
  </div>
  }

  <div class="mb-3">
    <label for="newPassword" class="form-label">Nueva contraseña</label>
    <div class="input-group has-validation">
      <input [type]="verPassword()['newPassword'] ? 'text' : 'password'" id="newPassword"
        formControlName="newPassword" class="form-control"
        [class.is-invalid]="form.get('newPassword')?.invalid && form.get('newPassword')?.touched">
      <button type="button" class="btn btn-outline-secondary" (click)="toggleVerPassword('newPassword')"
        [title]="verPassword()['newPassword'] ? 'Ocultar' : 'Mostrar'">
        <ion-icon [name]="verPassword()['newPassword'] ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </button>
      <div class="invalid-feedback">Mínimo 6 caracteres.</div>
    </div>
  </div>

  <div class="mb-3">
    <label for="confirmPassword" class="form-label">Confirmar nueva contraseña</label>
    <div class="input-group has-validation">
      <input [type]="verPassword()['confirmPassword'] ? 'text' : 'password'" id="confirmPassword"
        formControlName="confirmPassword" class="form-control"
        [class.is-invalid]="passwordsDoNotMatch">
      <button type="button" class="btn btn-outline-secondary" (click)="toggleVerPassword('confirmPassword')"
        [title]="verPassword()['confirmPassword'] ? 'Ocultar' : 'Mostrar'">
        <ion-icon [name]="verPassword()['confirmPassword'] ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
      </button>
      <div class="invalid-feedback">Las contraseñas no coinciden.</div>
    </div>
  </div>

  <div class="d-flex justify-content-end">
    <button type="button" class="btn btn-secondary me-2" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary" [disabled]="form.invalid">Cambiar contraseña</button>
  </div>
</form>
