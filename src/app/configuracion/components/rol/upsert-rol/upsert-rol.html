<form [formGroup]="form()" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label class="form-label">Nombre</label>
    <input type="text" class="form-control form-control-sm" formControlName="name" />

    @if (form().get('name')?.touched && form().get('name')?.invalid) {
      <div class="text-danger small">
        @if (form().get('name')?.errors?.['required']) {
          <div>Nombre es requerido</div>
        }
        @if (form().get('name')?.errors?.['minlength']) {
          <div>Mínimo 3 caracteres</div>
        }
      </div>
    }
  </div>


  <div class="row mb-3">
    <div class="col">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" formControlName="active" />
        <label class="form-check-label">Activo</label>
      </div>
    </div>

    <div class="col">
      <div class="form-check form-switch">
        <input class="form-check-input" type="checkbox" formControlName="guest" />
        <label class="form-check-label">Por defecto</label>
      </div>
    </div>
  </div>

  <div class="mb-3">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="cbxRolExterno" formControlName="externo" />
      <label class="form-check-label" for="cbxRolExterno">Rol para usuarios externos</label>
    </div>
    <small class="text-muted">Identifica los roles de OneSiteEx. Es informativo: no da ni quita permisos.</small>
  </div>

  <div class="mb-3">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" id="cbxRolGestionAccesos" formControlName="gestionAccesos" />
      <label class="form-check-label" for="cbxRolGestionAccesos">Gestión de accesos</label>
    </div>
  </div>

  <div class="row justify-content-end">
    <div class="col-auto">
      <button type="button" class="btn btn-secondary m-2" (click)="onCancel()">Cancelar</button>
      <button type="submit" class="btn btn-primary m-2" [disabled]="form().invalid">
        {{ btnText }}
      </button>
    </div>
  </div>
</form>
