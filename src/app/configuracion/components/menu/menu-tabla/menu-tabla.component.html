<table class="table table-striped table-sm table-bordered table-hover text-[0.85em]">
    <thead>
        <tr>
            <th class="text-center" scope="col">#</th>
            <th class="text-center" scope="col"></th>
            <th class="text-center" scope="col">Nombre</th>
            <th class="text-center" scope="col">Descripción</th>
            <th class="text-center" scope="col">Path App</th>
            <th class="text-center" scope="col">Path Web</th>
            <th class="text-center" scope="col">Activo</th>
            <th class="text-center" scope="col">Acciones</th>
        </tr>
    </thead>
    <tbody class="">
        @for (item of menuList(); track item.menuId; let i = $index) {
        <tr>
            <th scope="row">{{ (i + 1) + ((pagination().page - 1) * pagination().pageSize) }}
            </th>
            <td><ion-icon [name]="item.icon"></ion-icon></td>
            <td>{{ item.name }}</td>
            <td class="">{{ item.description }}</td>
            <td>{{ item.pathApp }}</td>
            <td>{{ item.pathWeb }}</td>
            <td class="text-center justify-items-center items-center">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" role="switch" id="switchCheckDefault{{i}}"
                        [checked]="item.active" (change)="onChangeActive(item, cbxActive.checked)" [value]="item.active"
                        #cbxActive>
                </div>
            </td>
            <!-- <td class="text-center justify-items-center items-center">
                        {{ item.created_at | date: 'dd/MM/yyyy' }} <br>
                    </td> -->
            <td class="text-center">
                <!-- <button class="btn btn-sm btn-secondary mx-1"
                            [routerLink]="['/config/rol/edit', item.rolId]"><ion-icon
                                name="eye-outline"></ion-icon></button> -->
                <button class="btn btn-sm btn-success mx-1" (click)="onOpenModal(item)"><ion-icon
                        name="create-outline"></ion-icon></button>
                <button class="btn btn-sm btn-danger mx-1" (click)="onOpenDeleteModal(item)"><ion-icon
                        name="trash-outline"></ion-icon></button>
            </td>
        </tr>
        }
    </tbody>
</table>
