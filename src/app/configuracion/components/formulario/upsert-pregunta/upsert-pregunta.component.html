<div class="row mb-3">
    <div class="col-12">
        <label class="form-label">Título <span class="text-danger">*</span></label>
        <input type="text" class="form-control form-control-sm"
            [ngModel]="form().titulo"
            (ngModelChange)="set('titulo', $event)"
            placeholder="Texto de la pregunta" maxlength="100" />
    </div>
</div>

<div class="row mb-3">
    <div class="col-12">
        <label class="form-label">Subtítulo</label>
        <input type="text" class="form-control form-control-sm"
            [ngModel]="form().subtitulo"
            (ngModelChange)="set('subtitulo', $event)"
            placeholder="Descripción o ayuda (opcional)" maxlength="250" />
    </div>
</div>

<div class="row mb-3">
    <div class="col-6">
        <label class="form-label">Tipo <span class="text-danger">*</span></label>
        <select class="form-select form-select-sm"
            [ngModel]="form().tipo"
            (ngModelChange)="set('tipo', $event)">
            @for (tipo of tiposPregunta; track tipo) {
            <option [value]="tipo">{{ tipo }}</option>
            }
        </select>
    </div>
    <div class="col-6">
        <label class="form-label">Placeholder</label>
        <input type="text" class="form-control form-control-sm"
            [ngModel]="form().placeholder"
            (ngModelChange)="set('placeholder', $event)"
            placeholder="Texto de ayuda en el campo"
            maxlength="100" />
    </div>
</div>

@if (requiresOpciones()) {
<div class="mb-3">
    <label class="form-label">
        Opciones <small class="text-muted">(separadas por coma, ej: Sí,No,Tal vez)</small>
    </label>
    <input type="text" class="form-control form-control-sm"
        [ngModel]="form().opciones"
        (ngModelChange)="set('opciones', $event)"
        placeholder="Opción1,Opción2,Opción3" />
</div>
}

<div class="mb-3">
    <label class="form-label">Valor por defecto</label>
    <input type="text" class="form-control form-control-sm"
        [ngModel]="form().valorDefecto"
        (ngModelChange)="set('valorDefecto', $event)" />
</div>

<div class="row align-items-end">
    <div class="col-4">
        <label class="form-label">Orden</label>
        <input type="number" class="form-control form-control-sm" min="0"
            [ngModel]="form().orden"
            (ngModelChange)="set('orden', $event)" />
    </div>
    <div class="col-8 d-flex gap-4 pb-1">
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="swObligatorio"
                [checked]="form().obligatorio"
                (change)="set('obligatorio', !form().obligatorio)" />
            <label class="form-check-label" for="swObligatorio">Obligatoria</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="swVisible"
                [checked]="form().visible"
                (change)="set('visible', !form().visible)" />
            <label class="form-check-label" for="swVisible">Visible</label>
        </div>
        <div class="form-check form-switch">
            <input class="form-check-input" type="checkbox" id="swPregActivo"
                [checked]="form().activo"
                (change)="set('activo', !form().activo)" />
            <label class="form-check-label" for="swPregActivo">Activa</label>
        </div>
    </div>
</div>

<div class="d-flex justify-content-end gap-2 mt-4">
    <button type="button" class="btn btn-secondary btn-sm" (click)="cancel.emit()">
        Cancelar
    </button>
    <button type="button" class="btn btn-primary btn-sm"
        [disabled]="!isValid()"
        (click)="onSubmit()">
        {{ nuevo() ? 'Crear pregunta' : 'Guardar cambios' }}
    </button>
</div>
