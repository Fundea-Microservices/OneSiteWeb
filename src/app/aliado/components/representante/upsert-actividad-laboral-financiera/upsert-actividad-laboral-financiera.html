<form (submit)="$event.preventDefault()">
  <!-- GRID 1 -->
  <div class="mt-0.5 grid gap-2 mb-2 sm:grid-cols-3">
    <!-- Ocupación -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="ocupacion"
      >
        Ocupación
      </label>
      <select
        [value]="selectedOcupacionId()"
        (change)="selectedOcupacionId.set($any($event.target).value)"
        id="ocupacion"
        name="ocupacion"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione Ocupación</option>
        @for (ocupacion of ocupaciones(); track ocupacion.catalogoId) {
          <option 
            [selected]="ocupacion.valorCore==selectedOcupacionId()"
            [value]="ocupacion.valorCore">{{ ocupacion.nombre }}</option>
        }
      </select>
    </div>

    <!-- Profesión -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="profesion"
      >
        Profesión
      </label>
      <select
        [value]="profesion()"
        (change)="profesion.set($any($event.target).value)"
        id="profesion"
        name="profesion"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione Profesión</option>
        @for (prof of profesiones(); track prof.catalogoId) {
          <option 
            [selected]="prof.valorCore==profesion()"
            [value]="prof.valorCore">{{ prof.nombre }}</option>
        }
      </select>
    </div>

    <!-- Empresa -->
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end" for="empresa">
        Empresa
      </label>
      <input
        [value]="nombreEmpresa()"
        (change)="nombreEmpresa.set($any($event.target).value)"
        id="empresa"
        name="empresa"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Nombre Empresa"
      />
    </div>
  </div>

  <!-- GRID 2 -->
  <div class="mt-0.5 grid gap-2 mb-2 sm:grid-cols-3">
    <!-- Actividad Laboral -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="actividad"
      >
        Actividad Laboral <span class="text-red-600">*</span>
      </label>
      <select
        [value]="actividadLaboral()"
        (change)="actividadLaboral.set($any($event.target).value)"
        id="actividad"
        name="actividad"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione Actividad</option>
        @for (actividad of actividadesLaborales(); track actividad.catalogoId) {
          <option 
            [selected]="actividad.valorCore==actividadLaboral()"
            [value]="actividad.valorCore">{{ actividad.nombre }}</option>
        }
      </select>
    </div>

    <!-- Fecha inicio -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="fechaInicio"
      >
        Fecha Inicio <span class="text-red-600">*</span>
      </label>

      <div class="relative">
        <div class="relative w-full">        
          <input
            [value]="fechaInicioActividad()"
            (input)="fechaInicioActividad.set($any($event.target).value)"
            type="date"
            class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg pl-4 pr-3 h-11 w-full"
            placeholder="Selecciona fecha"
          />
        </div>
      </div>
    </div>
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end" for="sector">
        Sector <span class="text-red-600">*</span>
      </label>
      <select
        [value]="selectedSectorId()"
        (change)="selectedSectorId.set($any($event.target).value)"
        id="sector"
        name="sector"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione</option>
        @for (sector of sectores(); track sector.catalogoId) {
          <option 
            [selected]="sector.valorCore==selectedSectorId()"
            [value]="sector.valorCore">{{ sector.nombre }}</option>
        }
      </select>
    </div>
  </div>

  <!-- GRID 3 -->
  <div class="mt-0.5 grid gap-2 mb-2 sm:grid-cols-3">
    
  </div>  
</form>
