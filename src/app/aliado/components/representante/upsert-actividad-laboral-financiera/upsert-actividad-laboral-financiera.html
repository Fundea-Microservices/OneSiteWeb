<form action="#">
  <!-- GRID 1 -->
  <div class="mt-0.5 grid gap-2 mb-2 sm:grid-cols-3">
    <!-- Ocupación -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="ocupacion"
      >
        Ocupación
      </label>
      <select
        [value]="selectedOcupacionId()"
        (change)="selectedOcupacionId.set($any($event.target).value)"
        id="ocupacion"
        name="ocupacion"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione Ocupación</option>
        @for (ocupacion of ocupaciones(); track ocupacion.catalogoId) {
          <option [value]="ocupacion.valorCore">{{ ocupacion.nombre }}</option>
        }
      </select>
    </div>

    <!-- Profesión -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="profesion"
      >
        Profesión
      </label>
      <input
        [value]="profesion()"
        (input)="profesion.set($any($event.target).value)"
        id="profesion"
        name="profesion"
        type="text"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5"
        placeholder="Profesión u oficio"
      />
    </div>

    <!-- Empresa -->
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end" for="empresa">
        Empresa
      </label>
      <input
        id="empresa"
        name="empresa"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Nombre Empresa"
      />
    </div>
  </div>

  <!-- GRID 2 -->
  <div class="mt-0.5 grid gap-2 mb-2 sm:grid-cols-3">
    <!-- Actividad Laboral -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="actividad"
      >
        Actividad Laboral <span class="text-red-600">*</span>
      </label>
      <select
        [value]="actividadLaboralId()"
        (change)="actividadLaboralId.set($any($event.target).value)"
        id="actividad"
        name="actividad"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione Actividad</option>
        @for (actividad of actividadesLaborales(); track actividad.catalogoId) {
          <option [value]="actividad.valorCore">{{ actividad.nombre }}</option>
        }
      </select>
    </div>

    <!-- Fecha inicio -->
    <div>
      <label
        class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end"
        for="fechaInicio"
      >
        Fecha Inicio <span class="text-red-600">*</span>
      </label>

      <div class="relative">
        <div class="absolute inset-y-0 start-0 flex items-center ps-3 pointer-events-none">
          <svg class="w-4 h-4 text-gray-500" aria-hidden="true" fill="none" viewBox="0 0 24 24">
            <path
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4 10h16m-8-3V4M7 7V4m10 3V4M5 20h14a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1Z"
            />
          </svg>
        </div>
        <input
          id="fechaInicio"
          datepicker
          datepicker-autohide
          type="text"
          class="w-full ps-10 p-2.5 text-sm border border-gray-300 rounded-lg bg-gray-50 focus:ring-blue-500 focus:border-blue-500"
          placeholder="Seleccione fecha"
        />
      </div>
    </div>

    <!-- Ingresos -->
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end" for="ingresos">
        Ingresos <span class="text-red-600">*</span>
      </label>
      <input
        id="ingresos"
        name="ingresos"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
        placeholder="Ingresos"
      />
    </div>
  </div>

  <!-- GRID 3 -->
  <div class="mt-0.5 grid gap-2 mb-2 sm:grid-cols-4">
    <div>
      <label class="text-sm font-medium text-gray-700 mb-1 h-8 flex items-end" for="sector">
        Sector <span class="text-red-600">*</span>
      </label>
      <select
        [value]="selectedSectorId()"
        (change)="selectedSectorId.set($any($event.target).value)"
        id="sector"
        name="sector"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
      >
        <option value="">Seleccione</option>
        @for (sector of sectores(); track sector.catalogoId) {
          <option [value]="sector.valorCore">{{ sector.nombre }}</option>
        }
      </select>
    </div>
  </div>  
</form>
