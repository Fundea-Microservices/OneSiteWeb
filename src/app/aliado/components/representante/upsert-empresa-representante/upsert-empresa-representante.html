<div class="bg-white rounded-lg p-6">
  <h3 class="text-xl font-semibold mb-4">{{ nuevo() ? 'Nueva Empresa' : 'Editar Empresa' }}</h3>
  
  <form class="space-y-4">
    <!-- Nombre de la empresa -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Nombre de la Empresa <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        [(ngModel)]="nombreEmpresa"
        [ngModelOptions]="{standalone: true}"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        maxlength="150"
      />
    </div>

    <!-- NIT -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        NIT <span class="text-red-500">*</span>
      </label>
      <input
        type="text"
        [value]="nit()"
        (input)="formatNit($event)"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        maxlength="10"
      />
    </div>

    <!-- Teléfono -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Teléfono
      </label>
      <input
        type="text"
        [(ngModel)]="telefono"
        [ngModelOptions]="{standalone: true}"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        maxlength="15"
      />
    </div>

    <!-- Departamento y Municipio -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Departamento <span class="text-red-500">*</span>
        </label>
        <select
          [(ngModel)]="selectedDepartamentoCode"
          [ngModelOptions]="{standalone: true}"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="0">Seleccione departamento</option>
          @for (depto of departamentos(); track depto.catalogoId) {
            <option [value]="depto.valorCore">{{ depto.nombre }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Municipio <span class="text-red-500">*</span>
        </label>
        <select
          [(ngModel)]="selectedMunicipioId"
          [ngModelOptions]="{standalone: true}"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          [disabled]="!selectedDepartamentoCode()"
        >
          <option value="">Seleccione municipio</option>
          @for (muni of municipiosFiltrados(); track muni.catalogoId) {
            <option [value]="muni.catalogoId">{{ muni.nombre }}</option>
          }
        </select>
      </div>
    </div>

    <!-- Dirección -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Dirección <span class="text-red-500">*</span>
      </label>
      <textarea
        [(ngModel)]="direccion"
        [ngModelOptions]="{standalone: true}"
        rows="2"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ingrese la dirección completa"
        maxlength="300"
      ></textarea>
    </div>

    <!-- Tipo de Actividad y Actividad -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Tipo de Actividad <span class="text-red-500">*</span>
        </label>
        <select
          [(ngModel)]="selectedTipoActividadId"
          [ngModelOptions]="{standalone: true}"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        >
          <option value="">Seleccione tipo de actividad</option>
          @for (tipo of tiposActividad(); track tipo.catalogoId) {
            <option [value]="tipo.catalogoId">{{ tipo.nombre }}</option>
          }
        </select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Actividad <span class="text-red-500">*</span>
        </label>
        <select
          [(ngModel)]="selectedActividadId"
          [ngModelOptions]="{standalone: true}"
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          [disabled]="!selectedTipoActividadId()"
        >
          <option value="">Seleccione actividad</option>
          @for (act of actividadesFiltradas(); track act.catalogoId) {
            <option [value]="act.catalogoId">{{ act.nombre }}</option>
        }
        <option value="1" > NA</option>
        </select>
      </div>
    </div>

    <!-- Detalle de Actividad -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Detalle de Actividad
      </label>
      <textarea
        [(ngModel)]="detalleActividad"
        [ngModelOptions]="{standalone: true}"
        rows="2"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Describa la actividad de la empresa"
        maxlength="300"
      ></textarea>
    </div>

    <!-- Fecha de Inicio de Actividad -->
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">
        Fecha de Inicio de Actividad
      </label>
      <input
        type="date"
        [(ngModel)]="fechaInicioActividad"
        [ngModelOptions]="{standalone: true}"
        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="dd/MM/yyyy"
        maxlength="10"
      />
      <p class="text-xs text-gray-500 mt-1">Formato: dd/MM/yyyy (ejemplo: 01/01/2025)</p>
    </div>

    <!-- Botones -->
    <div class="flex justify-end gap-3 mt-6">
      <button
        type="button"
        (click)="onCancel()"
        class="px-4 py-2 text-gray-700 bg-gray-200 rounded-md hover:bg-gray-300 focus:outline-none focus:ring-2 focus:ring-gray-400"
      >
        Cancelar
      </button>
      <button
        type="button"
        (click)="onSubmit()"
        [disabled]="!isFormValid()"
        class="px-4 py-2 text-white bg-blue-600 rounded-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-gray-400 disabled:cursor-not-allowed"
      >
        {{ btnText }}
      </button>
    </div>
  </form>
</div>
