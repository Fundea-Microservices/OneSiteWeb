<form action="#">
  <h3 class="section-title">Información de Contacto</h3>

  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-3">
    <div>
      <label class="block h-10 items-end text-sm font-medium text-gray-700" for="nombre">
        Teléfono Celular <span class="text-red-600">*</span>
      </label>
      <input
        [value]="telefonoCelular()"
        (input)="telefonoCelular.set($any($event.target).value)"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Número de teléfono"
        min="1"
        required
      />
    </div>

    <div>
      <label class="block h-10 items-end text-sm font-medium text-gray-700" for="nombre">
        Teléfono Fijo <span class="text-red-600">*</span>
      </label>
      <input
        [value]="telefonoFijo()"
        (input)="telefonoFijo.set($any($event.target).value)"
        type="number"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Número de teléfono"
        required
      />
    </div>

    <div>
      <label class="block h-10 items-end text-sm font-medium text-gray-700" for="nombre">
        Correo Electrónico <span class="text-red-600">*</span>
      </label>
      <input
        [value]="correoElectronico()"
        (input)="correoElectronico.set($any($event.target).value)"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Correo electrónico"
        required
      />
    </div>
  </div>

  <h3 class="section-title">Datos del Domicilio</h3>

  <div class="mt-2 grid gap-4 mb-4 sm:grid-cols-3">
    <div>
      <label class="block h-10 items-end text-sm font-medium text-gray-900" for="pais">
        País Domicilio <span class="text-red-600">*</span>
      </label>
      <select
        id="pais"
        name="pais"
        [value]="selectedPaisCode()"
        disabled
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5"
      >
        <option value="">Seleccione país</option>
        @for (pais of paises(); track pais.catalogoId) {
          <option 
            [value]="pais.valorCore"
            [selected]="pais.valorCore === selectedPaisCode()">
          {{ pais.nombre }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block h-10 items-end text-sm font-medium text-gray-900" for="departamento">
        Departamento <span class="text-red-600">*</span>
      </label>
      <select
        id="departamento"
        name="departamento"
        [value]="selectedDepartamentoCode()"
        (change)="selectedDepartamentoCode.set($any($event.target).value); onDepartamentoChange()"
        [disabled]="!selectedPaisCode()"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <option value="">Seleccione departamento</option>
        @for (depto of departamentosFiltrados(); track depto.catalogoId) {
          <option [selected]="depto.valorCore==selectedDepartamentoCode()" [value]="depto.valorCore">{{ depto.nombre }}</option>
        }
      </select>
    </div>

    <div>
      <label class="block h-10 items-end text-sm font-medium text-gray-900" for="municipio">
        Municipio<span class="text-red-600">*</span>
      </label>
      <select
        id="municipio"
        name="municipio"
        [value]="selectedMunicipioId()"
        (change)="selectedMunicipioId.set($any($event.target).value)"
        [disabled]="!selectedDepartamentoCode()"
        class="bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-600 focus:border-blue-600 block w-full p-2.5 disabled:opacity-50 disabled:cursor-not-allowed"
      >
        <option value="">Seleccione municipio</option>
        @for (municipio of municipiosFiltrados(); track municipio.catalogoId) {
          <option 
            [selected]="municipio.valorCore==selectedMunicipioId()"
            [value]="municipio.valorCore">{{ municipio.nombre }}</option>
        }
      </select>
    </div>

  </div>

  <div class="mt-0 grid gap-4 mb-4 sm:grid-cols-1">
    <div>
      <label class="block h-10 items-end text-sm font-medium text-gray-700" for="direccion">
        Dirección Completa <span class="text-red-600">*</span>
      </label>
      <input
        [value]="direccionCompleta()"
        (input)="direccionCompleta.set($any($event.target).value)"
        id="direccion"
        name="direccion"
        type="text"
        class="w-full px-3 py-2 text-sm border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Dirección"
        required
      />
    </div>
  </div>
</form>
