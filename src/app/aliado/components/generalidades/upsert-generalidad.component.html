<form class="row g-3" (ngSubmit)="onSave()">
  <div class="col-12">
    <label class="form-label">Nombre <span class="text-danger">*</span></label>
    <input type="text" class="form-control" [(ngModel)]="form.nombre" name="nombre" required>
  </div>

  <div class="col-12 d-flex align-items-center gap-2">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="switchActivo" [(ngModel)]="form.activo" name="activo">
      <label class="form-check-label" for="switchActivo">Activo</label>
    </div>
  </div>

  @if (esTipo) {
  <div class="col-12">
    <label class="form-label">Código</label>
    <input type="text" class="form-control" [(ngModel)]="form.codigo" name="codigo" placeholder="Ej: AFILIACION, CAMBIO_CUENTA">
    <small class="text-muted">Identificador estable (slug). No cambia entre entornos.</small>
  </div>

  <div class="col-12 d-flex align-items-center gap-2">
    <div class="form-check form-switch">
      <input class="form-check-input" type="checkbox" role="switch" id="switchMostrarPreg" [(ngModel)]="form.mostrarPreguntas" name="mostrarPreguntas">
      <label class="form-check-label" for="switchMostrarPreg">Mostrar preguntas</label>
    </div>
  </div>
  }

  <div class="col-12 d-flex justify-content-end gap-2">
    <button type="button" class="btn btn-outline-secondary" (click)="onCancel()">Cancelar</button>
    <button type="submit" class="btn btn-primary">Guardar</button>
  </div>
</form>
