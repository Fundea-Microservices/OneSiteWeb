
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="author" content="Yinka Enoch Adedokun">
	<title>Ingreso Aliado</title>
</head>
<body>
	<!-- Main Content -->
	<div class="container-fluid">
		<div class="row main-content text-center">
			<div class="col-md-5 text-center company__info">
				<span class="company__logo"><h2><span class="fa fa-android"></span></h2></span>
				<!-- <h4 class="company_title">Your Company Logo</h4> -->
                 <img src="images/fundea-logo-circular.jpg" alt="">
			</div>
			<div class="col-md-7 col-xs-12 col-sm-12 login_form ">
				<div class="container-fluid">
					<div class="row">
						<h2>Ingreso</h2>
					</div>
					<div class="row">
						<div class="form-group">
							<div class="row">
								<input type="text" name="username" class="form__input" placeholder="Usuario"
								[value]="userName()" (change)="userName.set(txtUserName.value)" (input)="userName.set(txtUserName.value)" #txtUserName>
							</div>
							<div class="row">
								<!-- <span class="fa fa-lock"></span> -->
								<input type="password" name="password" id="password" class="form__input" placeholder="Contraseña"
								[value]="password()" (change)="password.set(txtPassword.value)" (input)="password.set(txtPassword.value)" #txtPassword (keyup.enter)="login()">
							</div>							
							<div class="row flex justify-content-center">
								<input type="submit" value="Ingresar" class="btn" (click)="login()">
							</div>
						</div>
					</div>
					<!-- <div class="row">
						<p>Don't have an account? <a href="#">Register Here</a></p>
					</div> -->
				</div>
			</div>
		</div>
	</div>
	<!-- Footer -->
	<div class="container-fluid text-center footer">
		<span class="text-sm text-gray-500 sm:text-center dark:text-gray-400">© 2025 <a [routerLink]="['/']"
                class="hover:underline">FUNDEA</a>. All Rights Reserved.
        </span>
	</div>
</body>
